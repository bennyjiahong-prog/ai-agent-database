name: Autopilot-Ecosystem-Pipeline
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Current Workspace Context
        uses: actions/checkout@v4

      - name: Initialize Environment Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Code Dependencies
        run: |
          pip install feedparser requests
      - name: Execute Autonomous Agent Update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_bot.py

      - name: Validate Changes and Push to Production Origin
        run: |
          git config --global user.name "Ecosystem-Autopilot-Bot"
          git config --global user.email "autopilot@agent.infrastructure"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated telemetry database matrix update" && git push)
